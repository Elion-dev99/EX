name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  auto-merge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'cursor/') &&
      github.base_ref == 'main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge cursor/* PR after CI
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.merged || pr.draft) {
              core.info('PR already merged or draft; skipping.');
              return;
            }

            let merged = false;
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`GraphQL auto-merge unavailable (${message}); squash-merging now`);
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `${pr.title} (#${pr.number})`,
              });
              core.info(`Squash-merged PR #${pr.number}`);
              merged = true;
            }

            // GITHUB_TOKEN merges do not trigger push workflows, so dispatch Deploy explicitly.
            if (merged) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'main',
              });
              core.info('Dispatched Deploy workflow on main');
            }
