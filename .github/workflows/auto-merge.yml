name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-automerge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for cursor/* PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Could not enable auto-merge: ${message}`);
              core.warning(
                'GitHub Settings → General → Pull Requests で Allow auto-merge を有効にしてください。',
              );
            }

  merge-after-ci:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge cursor/* PR when CI is green
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];
            if (pulls.length === 0) {
              core.info('No linked pull requests on workflow_run.');
              return;
            }

            for (const partial of pulls) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: partial.number,
              });

              if (pr.draft) continue;
              if (!pr.head.ref.startsWith('cursor/')) continue;
              if (pr.base.ref !== 'main') continue;
              if (pr.merged) continue;

              try {
                await github.rest.pulls.enableAutoMerge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                core.info(`Auto-merge enabled for PR #${pr.number}`);
              } catch (error) {
                // Fallback: merge directly if auto-merge is disabled on the repo
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`enableAutoMerge failed (${message}); trying direct squash merge`);
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                });
                core.info(`Squash-merged PR #${pr.number}`);
              }
            }
