name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-automerge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge or squash-merge when CI is already green
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.merged || pr.draft) return;
            if (pr.base.ref !== 'main') return;

            async function tryAutoMerge() {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            }

            async function squashMerge() {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `${pr.title} (#${pr.number})`,
              });
              core.info(`Squash-merged PR #${pr.number}`);
            }

            // Prefer native auto-merge; fall back to direct merge for private repos
            // that have not enabled "Allow auto-merge" yet.
            try {
              await tryAutoMerge();
              return;
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`enableAutoMerge failed: ${message}`);
            }

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });
            const ciChecks = checks.data.check_runs.filter((run) => run.name === 'check');
            const ciPassed =
              ciChecks.length > 0 &&
              ciChecks.every((run) => run.status === 'completed' && run.conclusion === 'success');

            if (!ciPassed) {
              core.info('CI is not green yet; waiting for workflow_run merge job.');
              return;
            }

            await squashMerge();

  merge-after-ci:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge cursor/* PR when CI is green
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumbers = (run.pull_requests || []).map((p) => p.number);

            if (prNumbers.length === 0) {
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'main',
                per_page: 50,
              });
              prNumbers = pulls.data
                .filter((pr) => pr.head.sha === run.head_sha)
                .map((pr) => pr.number);
            }

            if (prNumbers.length === 0) {
              core.info('No matching open PR for this CI run.');
              return;
            }

            for (const number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (pr.draft || pr.merged) continue;
              if (!pr.head.ref.startsWith('cursor/')) continue;
              if (pr.base.ref !== 'main') continue;

              try {
                await github.rest.pulls.enableAutoMerge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                core.info(`Auto-merge enabled for PR #${pr.number}`);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`enableAutoMerge failed (${message}); trying direct squash merge`);
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                });
                core.info(`Squash-merged PR #${pr.number}`);
              }
            }
