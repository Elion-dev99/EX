name: Auto Merge

# Kept as a lightweight backup. Primary merge path is the `auto-merge` job in CI.yml
# (workflow_run only runs from the default branch, so it cannot merge the first PR).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-automerge:
    if: >
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Try enabling GitHub auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.info(`Auto-merge not enabled yet (${message}). CI job will squash-merge when green.`);
            }
