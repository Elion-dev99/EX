name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-automerge:
    if: >
      github.event.pull_request != null &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for cursor/* PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request payload; skipping.');
              return;
            }

            try {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Could not enable auto-merge: ${message}`);
              core.warning(
                'GitHub Settings → General → Pull Requests で Allow auto-merge を有効にしてください。',
              );
            }
